<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBlendAI</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --line: #dfe4ea;
    --ink: #1f2a37;
    --muted: #6b7684;
    --blue: #3a6ea5;
    --blue-dark: #2d5985;
    --blue-soft: #e8f0f9;
    --green: #2f7d5b;
    --amber: #95650c;
    --slate: #556173;
    --red: #b23b2a;
    --sans: Calibri, Carlito, "Segoe UI", sans-serif;                   /* interface text */
    --serif: "Times New Roman", Times, "Liberation Serif", serif;       /* headings and answers */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  h1, h2, p { margin: 0; }
  h1, h2 { font-family: var(--serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--blue); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  button, .choose { height: 36px; padding: 0 14px; border: 1px solid var(--blue); border-radius: 6px; background: var(--blue); color: #fff;
                    font-size: 15px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--blue-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .choose { display: inline-flex; align-items: center; background: #fff; color: var(--ink); border-color: var(--line); }
  .link { height: auto; padding: 0; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; }
  .link:hover:not(:disabled) { background: none; color: var(--red); }
  select { height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 15px; }

  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 24px; font-weight: 700; }

  main { height: calc(100% - 61px); display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; padding: 16px; }
  section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  h2 { padding: 10px 16px; font-size: 18px; border-bottom: 1px solid var(--line); }

  /* documents */
  .docs { overflow-y: auto; }
  form.upload { padding: 16px; display: grid; gap: 10px; }
  form.upload.dragging { background: var(--blue-soft); }
  .file-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #chosen { min-width: 0; font-size: 14.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-row { display: flex; gap: 8px; }
  .type-row select { flex: 1; min-width: 0; }
  #status { padding: 0 16px 12px; font-size: 14.5px; color: var(--muted); }
  #status:empty { display: none; }
  #status.ok { color: var(--green); }
  #status.error { color: var(--red); }
  #doc-list { list-style: none; margin: 0; padding: 0 16px 16px; }
  #doc-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .doc-main { flex: 1; min-width: 0; }
  .doc-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { font-size: 13.5px; color: var(--muted); }
  #doc-list .empty { color: var(--muted); font-size: 15px; }

  /* chat */
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .intro { color: var(--muted); }
  .entry { margin-bottom: 20px; }
  .q { width: fit-content; max-width: 80%; margin-left: auto; padding: 8px 12px; border-radius: 8px; background: var(--blue-soft); white-space: pre-wrap; }
  .answer { margin-top: 8px; max-width: 92%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
  .a { font-family: var(--serif); font-size: 17px; line-height: 1.55; }
  .a p { margin-bottom: 8px; }
  .a p:last-child { margin-bottom: 0; }
  .a ul, .a ol { margin: 0 0 8px; padding-left: 22px; }
  .entry.pending .a { color: var(--muted); }
  .entry.failed .a { color: var(--red); }
  .label { margin-top: 10px; font-size: 14.5px; color: var(--muted); }
  .label b { color: var(--tone); }
  .Certain { --tone: var(--green); }
  .Moderate { --tone: var(--amber); }
  .Uncertain { --tone: var(--slate); }
  .Unreadable { --tone: var(--red); }
  .sources { margin-top: 6px; font-size: 14.5px; color: var(--muted); }
  .sources summary { cursor: pointer; color: var(--blue); width: max-content; }
  .sources ol { margin: 6px 0 0; padding-left: 20px; }
  .sources em { font-style: normal; color: var(--green); }

  form.ask { display: flex; gap: 8px; align-items: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
  form.ask textarea { flex: 1; min-height: 40px; max-height: 160px; padding: 8px 10px; resize: none; line-height: 1.45;
                      border: 1px solid var(--line); border-radius: 6px; overflow-y: hidden; }
  form.ask textarea:focus { outline: none; border-color: var(--blue); }
  form.ask button { height: 40px; }

  /* phones: documents on top, chat below */
  @media (max-width: 800px) {
    main { height: auto; grid-template-columns: minmax(0, 1fr); padding: 10px; gap: 10px; }
    .chat { min-height: 75vh; }
    .q, .answer { max-width: 100%; }
  }
</style>
</head>
<body>

<header><h1>DocBlendAI</h1></header>

<main>
  <section class="docs" aria-labelledby="docs-title">
    <h2 id="docs-title">Documents</h2>
    <form class="upload" id="upload-form">
      <div class="file-row">
        <label class="choose" for="file">Choose file</label>
        <span id="chosen">or drop a file here</span>
      </div>
      <input type="file" id="file" class="sr-only" accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp,.docx,.pptx,.txt">
      <div class="type-row">
        <label class="sr-only" for="format-hint">Document type</label>
        <select id="format-hint">
          <option value="" disabled selected>Document type</option>
          <option value="typed">Typed</option>
          <option value="scanned">Scanned / printed</option>
          <option value="handwritten">Handwritten</option>
          <option value="auto">Detect automatically</option>
        </select>
        <button type="submit" id="upload-btn">Upload</button>
      </div>
    </form>
    <p id="status" role="status"></p>
    <ul id="doc-list"></ul>
  </section>

  <section class="chat" aria-labelledby="chat-title">
    <h2 id="chat-title">Chat</h2>
    <div id="messages"></div>
    <form class="ask" id="ask-form">
      <label class="sr-only" for="question">Your question</label>
      <textarea id="question" rows="1" placeholder="Ask a question about your documents"></textarea>
      <button type="submit" id="ask-btn">Ask</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (node.className = v) : node.setAttribute(k, v);
  node.append(...children);
  return node;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

/* ---------- server ----------
   The page is normally served by the DocBlendAI server; if index.html is opened
   directly, fall back to the default local server. */
const Server = {
  LOCAL: "http://127.0.0.1:8000",
  DOWN: "Cannot reach the DocBlendAI server. Start it with: venv/Scripts/python -m uvicorn app.main:app --port 8000, then open http://localhost:8000",
  base: null,
  async find() {
    if (this.base !== null) return;
    const candidates = location.protocol.startsWith("http") ? [location.origin, this.LOCAL] : [this.LOCAL];
    for (const base of candidates) {
      try {
        const r = await fetch(`${base}/health`);
        if (r.ok && (await r.json()).status === "ok") { this.base = base === location.origin ? "" : base; return; }
      } catch { /* try the next one */ }
    }
    throw new Error(this.DOWN);
  },
  url(path) { return `${this.base || ""}${path}`; },
  async call(path, options = {}) {
    await this.find();
    let resp;
    try { resp = await fetch(this.url(path), options); }
    catch { this.base = null; throw new Error(this.DOWN); }
    const body = resp.status === 204 ? {} : await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${resp.status})`);
    return { body, status: resp.status };
  },
};

/* ---------- documents ---------- */
const FORMAT = { typed: "Typed", scanned: "Scanned", handwritten: "Handwritten" };
const TEXT_FILES = ["docx", "pptx", "txt"];   // always typed, and have no page images
const extOf = (name) => name.split(".").pop().toLowerCase();

const Docs = {
  names: {},   // doc_id -> original file name

  nameOf(id) { return this.names[id] || id.slice(0, 8); },
  hasAny() { return Object.keys(this.names).length > 0; },
  hasPages(id) { return !TEXT_FILES.includes(extOf(this.nameOf(id))); },
  pageUrl(id, page) { return Server.url(`/documents/${id}/pages/${page}`); },
  status(text, kind = "") { const s = $("status"); s.className = kind; s.textContent = text; },

  fileName(doc) {  // stored as "<doc_id>_<original name>"
    const base = doc.file_path.split(/[\\/]/).pop();
    return base.startsWith(doc.doc_id + "_") ? base.slice(doc.doc_id.length + 1) : base;
  },

  async load() {
    const docs = (await Server.call("/documents")).body;
    this.names = {};
    const list = $("doc-list");
    list.replaceChildren();
    if (!docs.length) list.append(h("li", { class: "empty" }, "No documents yet."));
    for (const doc of docs) list.append(this.row(doc));
    Chat.intro();
  },

  row(doc) {
    const name = this.fileName(doc);
    this.names[doc.doc_id] = name;
    // PDFs and images open their first page in a new tab; Word/PowerPoint/text have no page images.
    const title = this.hasPages(doc.doc_id)
      ? h("a", { class: "doc-name", href: this.pageUrl(doc.doc_id, 1), target: "_blank", rel: "noopener" }, name)
      : h("span", { class: "doc-name" }, name);
    const remove = h("button", { type: "button", class: "link", "aria-label": `Remove ${name}` }, "Remove");
    remove.addEventListener("click", () => this.remove(doc.doc_id, remove));
    return h("li", {},
      h("div", { class: "doc-main" }, title,
        h("div", { class: "doc-meta" }, `${FORMAT[doc.format_type]} · ${plural(doc.page_count, "page")}`)),
      remove);
  },

  async remove(id, button) {   // deletes straight away, no confirmation
    button.disabled = true;
    const name = this.nameOf(id);
    try {
      await Server.call(`/documents/${id}`, { method: "DELETE" });
      this.status(`Removed ${name}.`);
      await this.load();
    } catch (e) {
      button.disabled = false;
      this.status(e.message, "error");
    }
  },

  async upload(file) {
    const form = new FormData();
    form.append("file", file);
    const hint = $("format-hint").value;
    if (hint && hint !== "auto" && !TEXT_FILES.includes(extOf(file.name))) form.append("format_hint", hint);
    const btn = $("upload-btn");
    btn.disabled = true; btn.textContent = "Uploading…";
    this.status("Reading the file. Scanned and handwritten pages take longer.");
    try {
      const { body: doc, status } = await Server.call("/upload", { method: "POST", body: form });
      await this.load();
      if (status === 200) this.status(`Already uploaded as ${this.nameOf(doc.doc_id)}.`);
      else this.status(`Added ${this.nameOf(doc.doc_id)} (${FORMAT[doc.format_type].toLowerCase()}, ${plural(doc.page_count, "page")}).`, "ok");
      $("upload-form").reset(); this.showChosen();
    } catch (e) {
      this.status(e.message, "error");
    } finally { btn.disabled = false; btn.textContent = "Upload"; }
  },

  showChosen() {
    const f = $("file").files[0], select = $("format-hint");
    $("chosen").textContent = f ? f.name : "or drop a file here";
    const typedOnly = !!f && TEXT_FILES.includes(extOf(f.name));
    if (typedOnly) select.value = "typed";
    else if (select.disabled) select.value = "";
    select.disabled = typedOnly;   // Word, PowerPoint and text files are always typed
  },

  init() {
    $("file").addEventListener("change", () => this.showChosen());
    $("upload-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const file = $("file").files[0];
      if (!file) { this.status("Choose a file first.", "error"); return; }
      if (!$("format-hint").value) { this.status("Choose the document type.", "error"); return; }
      this.upload(file);
    });
    // A file dropped anywhere on the page goes to the upload form.
    const box = $("upload-form");
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); box.classList.add("dragging"); } });
    window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) box.classList.remove("dragging"); });
    window.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      box.classList.remove("dragging");
      if (!e.dataTransfer.files.length) return;
      $("file").files = e.dataTransfer.files;
      this.showChosen();
    });
  },
};

/* ---------- chat (nothing is saved; the last turns go along for follow-up questions) ---------- */
const WHY = {
  Certain: "strong match in clearly readable text.",
  Moderate: "relevant text found, but the match was looser or the text only partly legible.",
  Uncertain: "no strong supporting passage; check the source.",
  Unreadable: "the source could not be read reliably.",
};

const Chat = {
  turns: [],

  intro() {
    const box = $("messages");
    if (box.querySelector(".entry")) return;
    box.replaceChildren(h("p", { class: "intro" },
      Docs.hasAny() ? "Ask a question about your documents." : "Upload a document, then ask a question about it."));
  },

  // Light Markdown (**bold**, lists) from the model. Escape first; never inject raw HTML.
  render(text) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    let html = "", list = null;
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const bullet = line.match(/^[-*•]\s+(.*)/), numbered = line.match(/^\d+[.)]\s+(.*)/);
      const kind = bullet ? "ul" : numbered ? "ol" : null;
      if (list && kind !== list) { html += `</${list}>`; list = null; }
      if (kind) { if (!list) { html += `<${kind}>`; list = kind; } html += `<li>${inline((bullet || numbered)[1])}</li>`; }
      else if (line) html += `<p>${inline(line)}</p>`;
    }
    if (list) html += `</${list}>`;
    const div = h("div", { class: "a" });
    div.innerHTML = html;
    return div;
  },

  source(s) {
    let where = s.page ? `p. ${s.page}` : "";
    if (s.page && s.first_line) where += s.last_line && s.last_line !== s.first_line ? `, lines ${s.first_line}–${s.last_line}` : `, line ${s.first_line}`;
    const place = where && Docs.hasPages(s.doc_id)
      ? h("a", { href: Docs.pageUrl(s.doc_id, s.page), target: "_blank", rel: "noopener" }, where)
      : where;
    const pct = (v) => `${Math.round(v * 100)}%`;
    return h("li", { title: s.text }, `${Docs.nameOf(s.doc_id)}${where ? ", " : ""}`, place,
      " — match ", h("em", {}, pct(s.similarity)), ", readability ", h("em", {}, pct(s.confidence)));
  },

  async ask(text) {
    const box = $("messages");
    box.querySelector(".intro")?.remove();
    const answer = h("div", { class: "answer" }, h("div", { class: "a" }, "Looking through your documents…"));
    const entry = h("div", { class: "entry pending" }, h("p", { class: "q" }, text), answer);
    box.append(entry);
    box.scrollTop = box.scrollHeight;
    try {
      const reply = (await Server.call("/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question_text: text, history: this.turns.slice(-3) }),
      })).body;
      this.turns.push({ question: text, answer: reply.answer.answer_text });
      const label = reply.answer.reliability_label;
      entry.className = "entry";
      answer.replaceChildren(this.render(reply.answer.answer_text),
        h("p", { class: `label ${label}` }, h("b", {}, label), ` – ${WHY[label]}`));
      if (reply.sources.length) {
        answer.append(h("details", { class: "sources" }, h("summary", {}, `Sources (${reply.sources.length})`),
          h("ol", {}, ...reply.sources.map((s) => this.source(s)))));
      }
      return true;
    } catch (e) {
      entry.className = "entry failed";
      answer.querySelector(".a").textContent = e.message;
      return false;
    } finally { box.scrollTop = box.scrollHeight; }
  },

  init() {
    const q = $("question"), btn = $("ask-btn");
    const fit = () => {
      q.style.height = "auto";
      q.style.height = `${Math.min(Math.max(q.scrollHeight, 40), 160)}px`;
      q.style.overflowY = q.scrollHeight > 160 ? "auto" : "hidden";
    };
    q.addEventListener("input", fit);
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask-form").requestSubmit(); } });
    $("ask-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text || btn.disabled) return;
      btn.disabled = true;
      q.value = ""; fit();
      if (!(await this.ask(text)) && !q.value) { q.value = text; fit(); }   // keep a failed question
      btn.disabled = false; q.focus();
    });
  },
};

Docs.init(); Chat.init();
Chat.intro();
Docs.load().catch((e) => Docs.status(e.message, "error"));
</script>
</body>
</html>
