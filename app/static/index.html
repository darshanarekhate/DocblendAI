<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBlendAI</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --paper: #faf8f3;       /* main reading surface */
    --paper-2: #f2eee5;     /* side pane, inputs */
    --rule: #ddd6c8;        /* dividing lines */
    --rule-dark: #c7bead;
    --ink: #1d2733;         /* text */
    --ink-2: #5d6673;       /* secondary text */
    --ink-3: #8b929b;       /* hints */
    --accent: #2d5b86;      /* the one action colour */
    --accent-dark: #22476a;
    --accent-wash: #e6edf4;
    --green: #3f7a57;       /* scores and "Certain" */
    --amber: #9a6a0a;
    --slate: #56606c;
    --red: #a8321f;
    --red-wash: #f7e4df;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- buttons: one filled, one plain, one text-only ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent);
         color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.plain { background: var(--paper); color: var(--ink); border-color: var(--rule-dark); font-weight: 500; }
  .btn.plain:hover:not(:disabled) { background: #fff; border-color: var(--ink-3); }
  .textlink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit;
              text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(45, 91, 134, .35); }
  .textlink:hover { text-decoration-color: currentColor; }
  .textlink.quiet { color: var(--ink-3); text-decoration: none; }
  .textlink.quiet:hover { color: var(--red); text-decoration: underline; }
  select { height: 34px; padding: 0 8px; border: 1px solid var(--rule-dark); border-radius: 4px; background: var(--paper); font-size: 14px; }

  /* ---- frame ---- */
  .top { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--rule); background: var(--paper); }
  .wordmark { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .top .note { font-size: 13.5px; color: var(--ink-2); }
  .top .grow { flex: 1; }
  .tabs { display: none; }
  .layout { height: calc(100% - 52px); display: grid; grid-template-columns: 330px minmax(0, 1fr); }
  .pane-title { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

  /* ---- documents pane ---- */
  .docs { display: flex; flex-direction: column; min-height: 0; background: var(--paper-2); border-right: 1px solid var(--rule); }
  .docs-head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 10px; }
  .docs-head .count { font-size: 12.5px; color: var(--ink-3); }
  .upload { margin: 0 20px; padding: 14px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper);
            transition: border-color .12s, background-color .12s; }
  .upload.dragging { border-color: var(--accent); background: var(--accent-wash); }
  .pick { display: flex; align-items: center; gap: 10px; }
  .pick .chosen { min-width: 0; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .chosen.set { color: var(--ink); font-weight: 500; }
  .upload .row { display: flex; gap: 8px; margin-top: 10px; }
  .upload .row select { flex: 1; min-width: 0; }
  .upload .hint { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
  .notice { margin: 10px 20px 0; font-size: 13.5px; color: var(--ink-2); }
  .notice:empty { display: none; }
  .notice.ok { color: var(--green); }
  .notice.error { color: var(--red); }

  .doc-list { list-style: none; margin: 14px 0 0; padding: 0 20px 20px; overflow-y: auto; flex: 1; }
  .doc { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
  .doc:last-child { border-bottom: 1px solid var(--rule); }
  .doc-main { flex: 1; min-width: 0; }
  .doc-name { display: block; max-width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
              font-size: 14.5px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .doc-meta { font-size: 12.5px; color: var(--ink-3); }
  .doc .textlink { font-size: 12.5px; flex: none; }
  .empty { padding: 12px 0; font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--rule); }

  /* ---- conversation pane ---- */
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; }
  .thread { max-width: 720px; margin: 0 auto; padding: 28px 28px 20px; }
  .intro { padding: 8px 0 0; color: var(--ink-2); }
  .intro h2 { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .intro ul { margin: 12px 0 0; padding-left: 18px; }
  .intro li { margin-bottom: 4px; }

  .entry { padding: 20px 0 22px; border-bottom: 1px solid var(--rule); }
  .entry:first-child { padding-top: 0; }
  .entry .q { font-weight: 600; font-size: 15.5px; }
  .entry .q::before { content: "Q."; color: var(--ink-3); font-weight: 600; margin-right: 8px; }
  .entry .a { margin-top: 8px; font-family: var(--serif); font-size: 16.5px; line-height: 1.65; }
  .entry .a p { margin-bottom: 10px; }
  .entry .a p:last-child { margin-bottom: 0; }
  .entry .a ul, .entry .a ol { margin: 0 0 10px; padding-left: 24px; }
  .entry .a li { margin-bottom: 3px; }
  .entry.pending .a { color: var(--ink-3); font-family: var(--sans); font-size: 14.5px; }
  .entry.failed .a { color: var(--red); font-family: var(--sans); font-size: 14.5px; }

  .verdict { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); }
  .verdict b { color: var(--tone); font-weight: 700; }
  .verdict b::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; background: var(--tone); vertical-align: 0; }
  .Certain { --tone: var(--green); }
  .Moderate { --tone: var(--amber); }
  .Uncertain { --tone: var(--slate); }
  .Unreadable { --tone: var(--red); }

  .sources { margin-top: 10px; font-size: 13.5px; }
  .sources > summary { cursor: pointer; color: var(--accent); width: max-content; }
  .sources ol { margin: 8px 0 0; padding: 0; list-style: none; }
  .sources li { padding: 6px 0; border-top: 1px dashed var(--rule); }
  .sources li:first-child { border-top: 0; }
  .ref { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .src-name { font-weight: 600; }
  .scores { color: var(--ink-3); }
  .scores em { font-style: normal; color: var(--green); font-weight: 600; }
  .sources blockquote { margin: 6px 0 2px; padding: 6px 10px; border-left: 2px solid var(--rule-dark); color: var(--ink-2);
                        white-space: pre-wrap; max-height: 170px; overflow: auto; font-size: 13px; }

  .composer { border-top: 1px solid var(--rule); background: var(--paper); }
  .composer form { max-width: 720px; margin: 0 auto; padding: 14px 28px 6px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; min-height: 40px; max-height: 160px; padding: 9px 11px; resize: none; line-height: 1.45;
                       border: 1px solid var(--rule-dark); border-radius: 4px; background: #fff; font-size: 15px; overflow-y: hidden; }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer .btn { height: 40px; padding: 0 18px; }
  .composer .hint { max-width: 720px; margin: 0 auto; padding: 0 28px 12px; font-size: 12.5px; color: var(--ink-3); }

  /* ---- preview window ---- */
  dialog.preview { width: min(780px, calc(100% - 32px)); padding: 0; border: 1px solid var(--rule-dark); border-radius: 6px;
                   background: var(--paper); color: var(--ink); }
  dialog.preview::backdrop { background: rgba(29, 39, 51, .4); }
  .pv { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .pv-head, .pv-foot { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .pv-head { border-bottom: 1px solid var(--rule); }
  .pv-head h2 { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-body { overflow: auto; background: var(--paper-2); padding: 14px; }
  .pv-body img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); background: #fff; }
  .pv-body pre { margin: 0; padding: 18px 20px; border: 1px solid var(--rule); background: #fff; font: 15px/1.7 var(--serif); white-space: pre-wrap; }
  .pv-foot { border-top: 1px solid var(--rule); justify-content: space-between; font-size: 13.5px; color: var(--ink-2); }
  .pv-foot .btn { height: 30px; }

  /* ---- phones: Chat | Documents ---- */
  @media (max-width: 860px) {
    .top { padding: 0 12px; gap: 10px; }
    .top .note { display: none; }
    .wordmark { font-size: 18px; }
    .tabs button { white-space: nowrap; }
    .tabs { display: flex; margin-left: auto; border: 1px solid var(--rule-dark); border-radius: 4px; overflow: hidden; }
    .tabs button { height: 30px; padding: 0 12px; border: 0; background: var(--paper); font-size: 14px; cursor: pointer; }
    .tabs button + button { border-left: 1px solid var(--rule-dark); }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
    .top .grow { display: none; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .docs { border-right: 0; }
    body[data-tab="chat"] .docs, body[data-tab="docs"] .chat { display: none; }
    .thread { padding: 20px 16px 16px; }
    .composer form { padding: 10px 12px 4px; }
    .composer .hint { padding: 0 12px 10px; }
  }
</style>
</head>
<body data-tab="chat">

<header class="top">
  <span class="wordmark">DocBlendAI</span>
  <span class="note">Questions and answers over your typed, scanned and handwritten notes</span>
  <span class="grow"></span>
  <nav class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" id="tab-chat" aria-selected="true">Chat</button>
    <button type="button" role="tab" id="tab-docs" aria-selected="false">Files</button>
  </nav>
  <button type="button" class="btn plain" id="new-chat">New chat</button>
</header>

<div class="layout">
  <!-- Documents -->
  <aside class="docs" aria-labelledby="docs-title">
    <div class="docs-head"><h2 class="pane-title" id="docs-title">Documents</h2><span class="count" id="doc-count"></span></div>
    <form class="upload" id="upload-form">
      <div class="pick">
        <label class="btn plain" for="file">Choose file…</label>
        <span class="chosen" id="chosen">No file chosen</span>
      </div>
      <input type="file" id="file" class="sr-only" accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp,.docx,.pptx,.txt">
      <div class="row">
        <label class="sr-only" for="format-hint">Document type</label>
        <select id="format-hint" title="Document type">
          <option value="">Detect type</option>
          <option value="typed">Typed</option>
          <option value="scanned">Scanned / printed</option>
          <option value="handwritten">Handwritten</option>
        </select>
        <button type="submit" class="btn" id="upload-btn">Upload</button>
      </div>
      <p class="hint">PDF, Word, PowerPoint, text or an image. You can also drop a file anywhere on the page.</p>
    </form>
    <p class="notice" id="upload-notice" role="status"></p>
    <ul class="doc-list" id="doc-list"></ul>
  </aside>

  <!-- Conversation -->
  <main class="chat" aria-label="Questions and answers">
    <div class="messages" id="messages"><div class="thread" id="thread"></div></div>
    <div class="composer">
      <form id="ask-form">
        <label class="sr-only" for="question">Your question</label>
        <textarea id="question" rows="1" placeholder="Type a question…"></textarea>
        <button type="submit" class="btn" id="ask-btn">Ask</button>
      </form>
      <p class="hint">Enter to ask, Shift + Enter for a new line. You can ask follow-up questions.</p>
    </div>
  </main>
</div>

<!-- Preview window -->
<dialog class="preview" id="preview" aria-labelledby="preview-title">
  <div class="pv">
    <div class="pv-head">
      <h2 id="preview-title"></h2>
      <button type="button" class="textlink" id="preview-close">Close</button>
    </div>
    <div class="pv-body" id="preview-body"></div>
    <div class="pv-foot">
      <button type="button" class="btn plain" id="page-prev">← Previous</button>
      <span><span id="page-where"></span> · <a id="page-full" target="_blank" rel="noopener">open full size</a></span>
      <button type="button" class="btn plain" id="page-next">Next →</button>
    </div>
  </div>
</dialog>

<script>
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (node.className = v) : node.setAttribute(k, v);
  node.append(...children);
  return node;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

/* ---------- server connection ----------
   Normally the page is served by the DocBlendAI server. If index.html is opened
   directly (or from an editor preview), fall back to the default local server. */
const Server = {
  LOCAL: "http://127.0.0.1:8000",
  DOWN: "Cannot reach the DocBlendAI server. Start it with: venv/Scripts/python -m uvicorn app.main:app --port 8000, then open http://localhost:8000",
  base: null,

  async find() {
    if (this.base !== null) return;
    const candidates = location.protocol.startsWith("http") ? [location.origin, this.LOCAL] : [this.LOCAL];
    for (const base of candidates) {
      try {
        const r = await fetch(`${base}/health`);
        if (r.ok && (await r.json()).status === "ok") { this.base = base === location.origin ? "" : base; return; }
      } catch { /* try the next one */ }
    }
    throw new Error(this.DOWN);
  },
  url(path) { return `${this.base || ""}${path}`; },

  async call(path, options = {}) {
    await this.find();
    let resp;
    try { resp = await fetch(this.url(path), options); }
    catch { this.base = null; throw new Error(this.DOWN); }
    const body = resp.status === 204 ? {} : await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${resp.status})`);
    return { body, status: resp.status };
  },
  async get(path) { return (await this.call(path)).body; },
  async post(path, data) {
    return (await this.call(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })).body;
  },
};

/* ---------- documents: upload, list, remove ---------- */
const FORMAT = { typed: "Typed", scanned: "Scanned", handwritten: "Handwritten" };
const EXT = { pdf: "PDF", docx: "Word", pptx: "PowerPoint", txt: "Text" };

const Docs = {
  names: {},   // doc_id -> original file name

  nameOf(id) { return this.names[id] || id.slice(0, 8); },
  hasAny() { return Object.keys(this.names).length > 0; },
  notice(text, kind = "") { const n = $("upload-notice"); n.className = `notice ${kind}`.trim(); n.textContent = text; },

  fileName(doc) {  // uploads are stored as "<doc_id>_<original name>.<ext>"
    const base = doc.file_path.split(/[\\/]/).pop();
    return base.startsWith(doc.doc_id + "_") ? base.slice(doc.doc_id.length + 1) : base;
  },

  async load() {
    const docs = await Server.get("/documents");
    this.names = {};
    const list = $("doc-list");
    list.replaceChildren();
    $("doc-count").textContent = docs.length ? plural(docs.length, "file") : "";
    if (!docs.length) list.append(h("li", { class: "empty" }, "Nothing uploaded yet."));
    for (const doc of docs) list.append(this.row(doc));
    Chat.refreshIntro();
  },

  row(doc) {
    const name = this.fileName(doc);
    this.names[doc.doc_id] = name;
    const kind = EXT[name.split(".").pop().toLowerCase()] || "Image";
    const open = h("button", { type: "button", class: "doc-name", title: `Open ${name}` }, name);
    open.addEventListener("click", () => Preview.open(doc.doc_id).catch((e) => this.notice(e.message, "error")));
    const remove = h("button", { type: "button", class: "textlink quiet", "aria-label": `Remove ${name}` }, "Remove");
    remove.addEventListener("click", () => this.remove(doc.doc_id, remove));
    return h("li", { class: "doc" },
      h("div", { class: "doc-main" }, open,
        h("div", { class: "doc-meta" }, `${kind} · ${FORMAT[doc.format_type].toLowerCase()} · ${plural(doc.page_count, "page")}`)),
      remove);
  },

  async remove(id, button) {   // deletes straight away, no confirmation
    button.disabled = true;
    const name = this.nameOf(id);
    try {
      await Server.call(`/documents/${id}`, { method: "DELETE" });
      Preview.forget(id);
      this.notice(`Removed ${name}.`);
      await this.load();
    } catch (e) {
      button.disabled = false;
      this.notice(e.message, "error");
    }
  },

  async upload(file) {
    const form = new FormData();
    form.append("file", file);
    const hint = $("format-hint").value;
    if (hint) form.append("format_hint", hint);
    const btn = $("upload-btn");
    btn.disabled = true; btn.textContent = "Uploading…";
    this.notice("Reading the file. Scanned and handwritten pages can take a minute.");
    try {
      const { body: doc, status } = await Server.call("/upload", { method: "POST", body: form });
      await this.load();
      if (status === 200) this.notice(`Already uploaded as ${this.nameOf(doc.doc_id)}, so it was not added again.`);
      else this.notice(`Added ${this.nameOf(doc.doc_id)} (${FORMAT[doc.format_type].toLowerCase()}, ${plural(doc.page_count, "page")}).`, "ok");
      $("upload-form").reset(); this.showChosen();
    } catch (e) {
      this.notice(e.message, "error");
    } finally { btn.disabled = false; btn.textContent = "Upload"; }
  },

  showChosen() {
    const f = $("file").files[0], c = $("chosen");
    c.textContent = f ? f.name : "No file chosen";
    c.classList.toggle("set", !!f);
  },

  init() {
    $("file").addEventListener("change", () => this.showChosen());
    $("upload-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const file = $("file").files[0];
      if (!file) { this.notice("Choose a file first.", "error"); return; }
      this.upload(file);
    });
    // A file dropped anywhere on the page goes to the upload form (instead of the browser opening it).
    const box = $("upload-form");
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); box.classList.add("dragging"); } });
    window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) box.classList.remove("dragging"); });
    window.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      box.classList.remove("dragging");
      if (!e.dataTransfer.files.length) return;
      $("file").files = e.dataTransfer.files;
      this.showChosen();
      this.notice("File ready. Press Upload.");
      Tabs.show("docs");
    });
  },
};

/* ---------- preview window: page images (PDF, images) or text (Word, PowerPoint, .txt) ---------- */
const Preview = {
  cache: {}, docId: null, page: 1, info: null,

  async open(docId, page = 1) {
    if (!this.cache[docId]) this.cache[docId] = await Server.get(`/documents/${docId}/preview`);
    this.docId = docId; this.info = this.cache[docId];
    this.page = Math.min(Math.max(1, page), this.info.page_count || 1);
    this.render();
    if (!$("preview").open) $("preview").showModal();
  },

  render() {
    const { info, page, docId } = this;
    $("preview-title").textContent = Docs.nameOf(docId);
    $("page-where").textContent = `Page ${page} of ${info.page_count}`;
    $("page-prev").disabled = page <= 1;
    $("page-next").disabled = page >= info.page_count;
    const body = $("preview-body"), full = $("page-full");
    if (info.kind === "text") {
      body.replaceChildren(h("pre", {}, info.text_pages[page - 1] || "(This page has no text.)"));
      full.hidden = true;
    } else {
      const src = Server.url(`/documents/${docId}/pages/${page}`);
      body.replaceChildren(h("img", { src, alt: `${Docs.nameOf(docId)}, page ${page}` }));
      full.href = src; full.hidden = false;
    }
    body.scrollTop = 0;
  },

  forget(docId) { delete this.cache[docId]; if (this.docId === docId && $("preview").open) $("preview").close(); },

  init() {
    $("page-prev").addEventListener("click", () => { this.page--; this.render(); });
    $("page-next").addEventListener("click", () => { this.page++; this.render(); });
    $("preview-close").addEventListener("click", () => $("preview").close());
    $("preview").addEventListener("click", (e) => { if (e.target === $("preview")) $("preview").close(); });  // click outside
  },
};

/* ---------- chat: the current conversation only (nothing is saved) ----------
   The last few turns go with each question so follow-ups like "explain that" work. */
const WHY = {
  Certain: "strong match in clearly readable text.",
  Moderate: "relevant text found, but the match was looser or the text was only partly legible.",
  Uncertain: "no strong supporting passage; check the source before relying on this.",
  Unreadable: "the relevant passage could not be read reliably (poor scan or handwriting).",
};

const Chat = {
  turns: [],   // {question, answer}

  reset() {
    this.turns = [];
    $("thread").replaceChildren(this.intro());
    $("question").focus();
  },

  intro() {
    return h("div", { class: "intro" },
      h("h2", {}, Docs.hasAny() ? "Ask a question about your documents" : "Upload a document to begin"),
      h("p", {}, "Answers come only from the documents you upload. Each one is marked with how far you can trust it:"),
      h("ul", {},
        h("li", {}, h("b", {}, "Certain"), " – found in clearly readable text"),
        h("li", {}, h("b", {}, "Moderate"), " – probably right, but check it"),
        h("li", {}, h("b", {}, "Uncertain"), " or ", h("b", {}, "Unreadable"), " – the source was weak or hard to read")));
  },
  refreshIntro() { const i = $("thread").querySelector(".intro"); if (i) i.replaceWith(this.intro()); },

  // Answers may use light Markdown (**bold**, lists). Escape first; never inject raw HTML.
  renderAnswer(text) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*(\S.*?)\*(?=\W|$)/g, "$1<em>$2</em>");
    let html = "", list = null;
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const bullet = line.match(/^[-*•]\s+(.*)/), numbered = line.match(/^\d+[.)]\s+(.*)/);
      const kind = bullet ? "ul" : numbered ? "ol" : null;
      if (list && kind !== list) { html += `</${list}>`; list = null; }
      if (kind) { if (!list) { html += `<${kind}>`; list = kind; } html += `<li>${inline((bullet || numbered)[1])}</li>`; }
      else if (line) html += `<p>${inline(line)}</p>`;
    }
    if (list) html += `</${list}>`;
    const div = h("div", { class: "a" });
    div.innerHTML = html;
    return div;
  },

  source(s, n) {
    const li = h("li", {}, h("span", { class: "ref" }, `[${n}]`), h("span", { class: "src-name" }, Docs.nameOf(s.doc_id)));
    if (s.page) {
      let text = `p. ${s.page}`;
      if (s.first_line) text += s.last_line && s.last_line !== s.first_line ? `, lines ${s.first_line}–${s.last_line}` : `, line ${s.first_line}`;
      const link = h("button", { type: "button", class: "textlink", title: "Open this page" }, text);
      link.addEventListener("click", () => Preview.open(s.doc_id, s.page).catch((e) => this.fail(e.message)));
      li.append(", ", link);
    }
    const pct = (v) => `${Math.round(v * 100)}%`;
    li.append(h("span", { class: "scores" }, " — match ", h("em", {}, pct(s.similarity)), ", readability ", h("em", {}, pct(s.confidence))),
      h("details", {}, h("summary", { class: "textlink" }, "show passage"), h("blockquote", {}, s.text)));
    return li;
  },

  fill(entry, answer, sources) {
    const label = answer.reliability_label;
    entry.className = "entry";
    entry.querySelector(".a").replaceWith(this.renderAnswer(answer.answer_text));
    entry.append(h("p", { class: `verdict ${label}` }, h("b", {}, label), ` — ${WHY[label]}`));
    if (sources.length) {
      const list = h("ol", {});
      sources.forEach((s, i) => list.append(this.source(s, i + 1)));
      entry.append(h("details", { class: "sources" }, h("summary", {}, `Sources (${sources.length})`), list));
    }
  },

  fail(message) { $("thread").append(h("div", { class: "entry failed" }, h("div", { class: "a" }, message))); this.scroll(); },
  scroll() { const m = $("messages"); m.scrollTop = m.scrollHeight; },

  async ask(text) {
    const thread = $("thread");
    thread.querySelector(".intro")?.remove();
    const entry = h("div", { class: "entry pending" }, h("p", { class: "q" }, text), h("div", { class: "a" }, "Looking through your documents…"));
    thread.append(entry);
    this.scroll();
    try {
      const reply = await Server.post("/chat", { question_text: text, history: this.turns.slice(-3) });
      this.turns.push({ question: text, answer: reply.answer.answer_text });
      this.fill(entry, reply.answer, reply.sources);
      return true;
    } catch (e) {
      entry.className = "entry failed";
      entry.querySelector(".a").textContent = e.message;
      return false;
    } finally { this.scroll(); }
  },

  init() {
    const q = $("question"), btn = $("ask-btn");
    const fit = () => {
      q.style.height = "auto";
      q.style.height = `${Math.min(Math.max(q.scrollHeight, 40), 160)}px`;
      q.style.overflowY = q.scrollHeight > 160 ? "auto" : "hidden";   // scrollbar only when really needed
    };
    q.addEventListener("input", fit);
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask-form").requestSubmit(); } });
    $("ask-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text || btn.disabled) return;
      btn.disabled = true;
      q.value = ""; fit();
      const ok = await this.ask(text);
      if (!ok && !q.value) { q.value = text; fit(); }   // keep the question so it can be re-sent
      btn.disabled = false; q.focus();
    });
    $("new-chat").addEventListener("click", () => { this.reset(); Tabs.show("chat"); });
  },
};

/* ---------- phones: Chat | Documents ---------- */
const Tabs = {
  show(tab) {
    document.body.dataset.tab = tab;
    $("tab-chat").setAttribute("aria-selected", tab === "chat");
    $("tab-docs").setAttribute("aria-selected", tab === "docs");
  },
  init() {
    $("tab-chat").addEventListener("click", () => this.show("chat"));
    $("tab-docs").addEventListener("click", () => this.show("docs"));
  },
};

/* ---------- start ---------- */
Docs.init(); Preview.init(); Chat.init(); Tabs.init();
Chat.reset();
Docs.load().catch((e) => { Docs.notice(e.message, "error"); Chat.fail(e.message); });
</script>
</body>
</html>
