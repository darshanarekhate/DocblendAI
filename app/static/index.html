<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBlendAI</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ee;          /* warm off-white */
    --surface: #fffdfa;
    --sunk: #f2eee6;
    --ink: #1e2b3c;         /* dark navy text */
    --heading: #1b2a41;
    --muted: #5f6b7a;
    --faint: #8a929c;
    --line: #e2ddd3;
    --line-strong: #cfc8bb;
    --blue: #4b6a8c;        /* muted blue: buttons, links, active items */
    --blue-hover: #3e5a78;
    --blue-soft: #e8eef4;
    --green: #5a8f6e;       /* soft green: confidence scores */
    --green-bg: #e6f0e8;
    --certain: #3f7a55;    --certain-bg: #e6f0e8;
    --moderate: #8a6420;   --moderate-bg: #f4ecdb;
    --uncertain: #56606d;  --uncertain-bg: #eceef0;
    --unreadable: #9a3b34; --unreadable-bg: #f4e4e1;
    --error: #9a3b34;
    --radius: 6px;
    --header-h: 56px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--sans); overflow: hidden; }
  h1, h2, h3 { color: var(--heading); margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---------- app frame: header + three independently scrolling columns ---------- */
  header { height: var(--header-h); display: flex; align-items: center; gap: 12px; padding: 0 18px;
           background: var(--surface); border-bottom: 1px solid var(--line); }
  header h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  header .tagline { font-size: 13.5px; color: var(--muted); }
  header .spacer { flex: 1; }
  .panel-toggle { display: none; }
  .app { height: calc(100% - var(--header-h)); display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .docs-panel { overflow-y: auto; background: var(--surface); }
  .docs-panel { border-left: 1px solid var(--line); padding: 16px; display: grid; gap: 22px; align-content: start; }
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ---------- buttons & fields ---------- */
  .btn { border: 1px solid var(--blue); border-radius: var(--radius); background: var(--blue); color: #fff;
         padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--blue-hover); border-color: var(--blue-hover); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-outline { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface);
                 padding: 7px 12px; font-size: 14px; cursor: pointer; }
  .btn-outline:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .btn-outline:disabled { opacity: 0.4; cursor: default; }
  .icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 4px;
              background: none; color: var(--faint); cursor: pointer; }
  .icon-btn:hover { background: var(--sunk); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--error); }
  select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-strong);
                     border-radius: var(--radius); padding: 8px 10px; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }
  .section-title h2 { font-size: 15px; font-weight: 600; }
  .section-title span { font-size: 12.5px; color: var(--muted); }
  .status { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; }
  .status:empty { display: none; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--certain); }

  .muted-note { font-size: 13.5px; color: var(--muted); margin: 4px 0; }

  /* ---------- chat column ---------- */
  .messages { flex: 1; overflow-y: auto; padding: 24px 28px 12px; }
  .messages-inner { max-width: 780px; margin: 0 auto; display: grid; gap: 18px; }
  .welcome { max-width: 520px; margin: 12vh auto 0; text-align: center; }
  .welcome h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .welcome p { margin: 0; color: var(--muted); }
  .msg-user { justify-self: end; max-width: 78%; padding: 10px 14px; border-radius: 10px 10px 2px 10px;
              background: var(--blue-soft); color: var(--heading); white-space: pre-wrap; }
  .msg-bot { justify-self: stretch; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line);
             border-radius: 10px 10px 10px 2px; }
  .msg-bot .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .msg-bot .who { font-size: 13px; font-weight: 600; color: var(--muted); }
  .msg-bot .body p { margin: 0 0 10px; }
  .msg-bot .body p:last-child { margin-bottom: 0; }
  .msg-bot .body ul, .msg-bot .body ol { margin: 0 0 10px; padding-left: 22px; }
  .msg-bot .why { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); }
  .msg-bot.pending .body { color: var(--muted); }
  .msg-bot.failed { border-color: #e7c9c4; }
  .msg-bot.failed .body { color: var(--error); }
  .dots::after { content: "…"; display: inline-block; width: 1.2em; animation: dots 1.2s steps(4) infinite; overflow: hidden;
                 vertical-align: bottom; }
  @keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }

  .tag { padding: 1px 9px; border-radius: 4px; font-size: 12.5px; font-weight: 600; color: var(--tier); background: var(--tier-bg); }
  .Certain { --tier: var(--certain); --tier-bg: var(--certain-bg); }
  .Moderate { --tier: var(--moderate); --tier-bg: var(--moderate-bg); }
  .Uncertain { --tier: var(--uncertain); --tier-bg: var(--uncertain-bg); }
  .Unreadable { --tier: var(--unreadable); --tier-bg: var(--unreadable-bg); }

  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sources > summary { cursor: pointer; font-size: 13.5px; color: var(--blue); }
  .sources ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
  .cite { display: grid; grid-template-columns: 24px minmax(0, 1fr); font-size: 14px; }
  .cite-n { grid-row: span 3; color: var(--faint); font-weight: 600; }
  .cite-where { overflow-wrap: anywhere; }
  .cite-where b { font-weight: 600; }
  .cite-page { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; white-space: nowrap;
               text-decoration: underline; text-underline-offset: 2px; }
  .scores { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .meter { display: inline-flex; align-items: center; gap: 6px; }
  .meter i { display: inline-block; width: 52px; height: 5px; border-radius: 3px; background: var(--green-bg); overflow: hidden; }
  .meter i b { display: block; height: 100%; background: var(--green); }
  .meter em { font-style: normal; font-weight: 600; color: var(--green); }
  .cite details summary { cursor: pointer; font-size: 13px; color: var(--blue); }
  .cite blockquote { margin: 6px 0 0; padding: 8px 12px; border-left: 3px solid var(--line-strong); background: var(--sunk);
                     border-radius: 0 4px 4px 0; white-space: pre-wrap; max-height: 180px; overflow: auto; font-size: 13.5px; }

  .composer { border-top: 1px solid var(--line); background: var(--bg); padding: 12px 28px 16px; }
  .composer form { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: end;
                   background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .composer form:focus-within { border-color: var(--blue); }
  .composer textarea { border: 0; padding: 6px 0; resize: none; min-height: 24px; max-height: 180px; line-height: 1.5;
                       background: transparent; font-size: 15.5px; }
  .composer textarea:focus-visible { outline: none; }
  .composer .hint { max-width: 780px; margin: 6px auto 0; font-size: 12.5px; color: var(--faint); }

  /* ---------- documents panel ---------- */
  .drop { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 12px; text-align: center;
          border: 1.5px dashed var(--line-strong); border-radius: var(--radius); background: var(--sunk); cursor: pointer; }
  .drop:hover, .drop.dragging { border-color: var(--blue); background: var(--blue-soft); }
  .drop svg { color: var(--blue); margin-bottom: 4px; }
  .drop strong { font-size: 14.5px; font-weight: 600; }
  .drop small { font-size: 12.5px; color: var(--muted); }
  .drop .chosen { margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--blue); word-break: break-all; }
  .upload-row { display: flex; gap: 8px; margin-top: 10px; }
  .upload-row select { flex: 1; min-width: 0; font-size: 14px; }

  ul.docs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .doc { display: flex; align-items: center; gap: 4px; padding: 7px 6px 7px 8px; border: 1px solid var(--line);
         border-radius: var(--radius); background: var(--surface); }
  .doc:hover { border-color: var(--line-strong); }
  .doc.selected { border-color: var(--blue); background: var(--blue-soft); }
  .doc-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0;
              padding: 0; text-align: left; cursor: pointer; }
  .ftype { flex: none; width: 40px; padding: 2px 0; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
           color: var(--blue); background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; }
  .doc-info { min-width: 0; }
  .doc-name { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { display: block; font-size: 12.5px; color: var(--muted); }

  .preview-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .preview-nav .where { font-size: 13.5px; color: var(--muted); }
  .preview-name { font-size: 13.5px; font-weight: 600; margin: -4px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-page { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; overflow: auto; max-height: 520px; }
  .preview-page img { display: block; width: 100%; height: auto; }
  .preview-page pre { margin: 0; padding: 12px; font: 13.5px/1.6 var(--sans); white-space: pre-wrap; }
  .preview-open { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--blue); }

  /* ---------- responsive: side panels become drawers ---------- */
  .scrim { display: none; }
  @media (max-width: 1180px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .docs-panel { position: fixed; top: var(--header-h); right: 0; bottom: 0; width: min(380px, 92vw); z-index: 20;
                  transform: translateX(100%); transition: transform .18s ease; box-shadow: -1px 0 0 var(--line); }
    body.show-docs .docs-panel { transform: none; }
    .panel-toggle.docs { display: inline-flex; }
  }
  @media (max-width: 760px) {
    header .tagline { display: none; }
    .messages { padding: 16px 14px 8px; }
    .composer { padding: 10px 12px 12px; }
    .msg-user { max-width: 90%; }
  }
  @media (max-width: 1180px) {
    body.show-docs .scrim { display: block; position: fixed; inset: var(--header-h) 0 0 0;
                                                    background: rgba(30, 43, 60, 0.25); z-index: 10; }
  }
</style>
</head>
<body>
<header>
  <h1>DocBlendAI</h1>
  <span class="tagline">Question answering over typed, scanned and handwritten notes</span>
  <span class="spacer"></span>
  <button type="button" class="btn-outline" id="new-chat" title="Clear this conversation and start again">New chat</button>
  <button type="button" class="btn-outline panel-toggle docs" id="toggle-docs" aria-controls="docs-panel">Documents</button>
</header>

<div class="app">
  <!-- Conversation -->
  <main class="chat" aria-label="Conversation">
    <div class="messages" id="messages">
      <div class="messages-inner" id="thread"></div>
    </div>
    <div class="composer">
      <form id="ask-form">
        <label class="visually-hidden" for="question">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask about your documents…" required></textarea>
        <button type="submit" class="btn" id="ask-btn">Send</button>
      </form>
      <p class="hint">Enter to send · Shift + Enter for a new line · Answers come only from your uploaded documents</p>
    </div>
  </main>

  <!-- Documents: upload, list, preview -->
  <aside class="docs-panel" id="docs-panel" aria-label="Documents">
    <section aria-labelledby="upload-title">
      <div class="section-title"><h2 id="upload-title">Upload</h2></div>
      <form id="upload-form">
        <label class="drop" id="drop" for="file">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>
          </svg>
          <strong>Drag a file here, or click to browse</strong>
          <small>PDF, Word, PowerPoint, text, or an image</small>
          <span class="chosen" id="chosen"></span>
        </label>
        <input type="file" id="file" class="visually-hidden" required
               accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp,.docx,.pptx,.txt">
        <div class="upload-row">
          <label class="visually-hidden" for="hint">Document type</label>
          <select id="hint" title="Document type">
            <option value="">Detect type automatically</option>
            <option value="typed">Typed</option>
            <option value="scanned">Scanned or printed</option>
            <option value="handwritten">Handwritten</option>
          </select>
          <button type="submit" class="btn" id="upload-btn">Upload</button>
        </div>
        <p class="status" id="upload-status" role="status"></p>
      </form>
    </section>

    <section aria-labelledby="docs-title">
      <div class="section-title"><h2 id="docs-title">Documents</h2><span id="doc-count"></span></div>
      <ul class="docs" id="docs"></ul>
    </section>

    <section id="preview" aria-labelledby="preview-title" hidden>
      <div class="section-title"><h2 id="preview-title">Preview</h2>
        <button type="button" class="icon-btn" id="close-preview" aria-label="Close preview">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="preview-name" id="preview-name"></p>
      <div class="preview-nav">
        <button type="button" class="btn-outline" id="prev-page" aria-label="Previous page">‹ Prev</button>
        <span class="where" id="preview-where"></span>
        <button type="button" class="btn-outline" id="next-page" aria-label="Next page">Next ›</button>
      </div>
      <div class="preview-page" id="preview-page"></div>
      <a class="preview-open" id="preview-open" target="_blank" rel="noopener" hidden>Open page at full size</a>
    </section>
  </aside>
</div>
<div class="scrim" id="scrim"></div>

<script>
const WHY = {
  Certain: "Strong match in clearly readable text.",
  Moderate: "Relevant text found, but the match was looser or the text was only partly legible.",
  Uncertain: "No strong supporting passage. Check the source before relying on this.",
  Unreadable: "The relevant passage could not be read reliably (poor scan or handwriting).",
};
const FORMAT_LABEL = { typed: "Typed", scanned: "Scanned", handwritten: "Handwritten" };
const TYPE_TAG = { pdf: "PDF", docx: "DOCX", pptx: "PPTX", txt: "TXT" };
const ICON = {
  trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
};
const $ = (id) => document.getElementById(id);

// ---------------- helpers ----------------
const docNames = {};
function nameFromPath(doc) {  // uploads are stored as "<doc_id>_<original name>.<ext>"
  const base = doc.file_path.split(/[\\/]/).pop();
  return base.startsWith(doc.doc_id + "_") ? base.slice(doc.doc_id.length + 1) : base;
}
function docLabel(id) { return docNames[id] || id.slice(0, 8); }
function typeTag(name) { return TYPE_TAG[name.split(".").pop().toLowerCase()] || "IMG"; }
function pages(n) { return `${n} page${n === 1 ? "" : "s"}`; }
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (node.className = v) : node.setAttribute(k, v);
  for (const c of children) node.append(c);
  return node;
}
function iconButton(icon, label, extra = "") {
  const b = el("button", { type: "button", class: `icon-btn ${extra}`.trim(), "aria-label": label, title: label });
  b.innerHTML = ICON[icon];
  return b;
}
function setStatus(id, text, kind = "") { const s = $(id); s.className = `status ${kind}`.trim(); s.textContent = text; }
// Answers may use light Markdown (**bold**, lists). Escape first, then format: never inject raw HTML.
function renderAnswer(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*(\S.*?)\*(?=\W|$)/g, "$1<em>$2</em>");
  let html = "", list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[-*•]\s+(.*)/), numbered = line.match(/^\d+[.)]\s+(.*)/);
    const kind = bullet ? "ul" : numbered ? "ol" : null;
    if (list && kind !== list) { html += `</${list}>`; list = null; }
    if (kind) {
      if (!list) { html += `<${kind}>`; list = kind; }
      html += `<li>${inline((bullet || numbered)[1])}</li>`;
    } else if (line) {
      html += `<p>${inline(line)}</p>`;
    }
  }
  if (list) html += `</${list}>`;
  const div = el("div", { class: "body" });
  div.innerHTML = html;
  return div;
}

// ---------------- server connection ----------------
// Normally the page is served by the DocBlendAI server (same origin). If index.html was opened
// directly or from an editor preview, fall back to the default local server.
const LOCAL_SERVER = "http://127.0.0.1:8000";
const SERVER_DOWN = "Cannot reach the DocBlendAI server. Start it with: " +
  "venv/Scripts/python -m uvicorn app.main:app --port 8000, then open http://localhost:8000";
let apiBase = null;
async function findServer() {
  if (apiBase !== null) return apiBase;
  const candidates = location.protocol.startsWith("http") ? [location.origin, LOCAL_SERVER] : [LOCAL_SERVER];
  for (const base of candidates) {
    try {
      const resp = await fetch(`${base}/health`);
      if (resp.ok && (await resp.json()).status === "ok") return (apiBase = base === location.origin ? "" : base);
    } catch { /* try the next one */ }
  }
  throw new Error(SERVER_DOWN);
}
const url = (path) => `${apiBase || ""}${path}`;
async function api(path, options, withStatus = false) {
  await findServer();
  let resp;
  try { resp = await fetch(url(path), options); }
  catch { apiBase = null; throw new Error(SERVER_DOWN); }
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${resp.status})`);
  return withStatus ? { body, status: resp.status } : body;
}
const json = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });

// ---------------- drawers (tablet / phone) ----------------
function closeDrawers() { document.body.classList.remove("show-docs"); }
$("toggle-docs").addEventListener("click", () => document.body.classList.toggle("show-docs"));
$("scrim").addEventListener("click", closeDrawers);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawers(); });
const isDrawer = (id) => getComputedStyle($(id)).position === "fixed";

function showWelcome() {
  const hasDocs = Object.keys(docNames).length > 0;
  $("thread").replaceChildren(el("div", { class: "welcome" },
    el("h2", {}, "Ask about your documents"),
    el("p", {}, hasDocs
      ? "Ask a question and follow up on it. Every answer shows how far to trust it and which pages it came from."
      : "Start by uploading a document in the Documents panel, then ask a question here.")));
}

// The current conversation lives only in this page: it is sent along with each question so
// follow-ups work, and is gone after "New chat" or a reload. No chat history is kept.
let turns = [];  // {question, answer}

function newChat() {
  turns = [];
  showWelcome();
  $("question").focus();
}
$("new-chat").addEventListener("click", newChat);

// ---------------- messages ----------------
function userMessage(text) { return el("div", { class: "msg-user" }, text); }

function meter(label, v) {
  const pct = Math.round(v * 100);
  return el("span", { class: "meter", title: `${label} ${pct}%` }, label, el("i", {}, el("b", { style: `width:${pct}%` })), el("em", {}, `${pct}%`));
}

function citation(s, n) {
  const where = el("div", { class: "cite-where" }, el("b", {}, docLabel(s.doc_id)));
  if (s.page) {
    let text = `Page ${s.page}`;
    if (s.first_line) text += s.last_line && s.last_line !== s.first_line ? `, lines ${s.first_line}–${s.last_line}` : `, line ${s.first_line}`;
    const link = el("button", { class: "cite-page", type: "button", title: "Show this page" }, text);
    link.addEventListener("click", () => openPreview(s.doc_id, s.page, true).catch((err) => alert(err.message)));
    where.append(" · ", link);
  }
  return el("li", { class: "cite" },
    el("span", { class: "cite-n" }, `${n}.`),
    where,
    el("div", { class: "scores" }, meter("Match", s.similarity), meter("Readability", s.confidence)),
    el("details", {}, el("summary", {}, "Show passage"), el("blockquote", {}, s.text)));
}

function botMessage(answer, sources) {
  const label = answer.reliability_label;
  const node = el("div", { class: "msg-bot" },
    el("div", { class: "top" }, el("span", { class: "who" }, "DocBlendAI"), el("span", { class: `tag ${label}` }, label)),
    renderAnswer(answer.answer_text),
    el("p", { class: "why" }, WHY[label]));
  if (sources.length) {
    const list = el("ol", {});
    sources.forEach((s, i) => list.append(citation(s, i + 1)));
    node.append(el("details", { class: "sources" }, el("summary", {}, `Sources (${sources.length})`), list));
  }
  return node;
}

function scrollToEnd() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

const question = $("question");
function fitComposer() { question.style.height = "auto"; question.style.height = `${Math.min(question.scrollHeight, 180)}px`; }
question.addEventListener("input", fitComposer);
question.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask-form").requestSubmit(); }
});

$("ask-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  const btn = $("ask-btn");
  btn.disabled = true;
  const thread = $("thread");
  thread.querySelector(".welcome")?.remove();
  const pending = el("div", { class: "msg-bot pending" }, el("div", { class: "body" }, el("span", { class: "dots" }, "Reading your documents")));
  thread.append(userMessage(text), pending);
  question.value = ""; fitComposer();
  scrollToEnd();
  try {
    const reply = await api("/chat", json("POST", { question_text: text, history: turns.slice(-3) }));
    turns.push({ question: text, answer: reply.answer.answer_text });
    pending.replaceWith(botMessage(reply.answer, reply.sources));
  } catch (err) {
    pending.className = "msg-bot failed";
    pending.replaceChildren(el("div", { class: "body" }, err.message));
    if (!question.value) { question.value = text; fitComposer(); }  // keep the question so it can be re-sent
  } finally {
    btn.disabled = false; question.focus(); scrollToEnd();
  }
});

// ---------------- documents ----------------
const view = { docId: null, page: 1, info: null };
const previewCache = {};

async function openPreview(docId, page = 1, reveal = false) {
  if (!previewCache[docId]) previewCache[docId] = await api(`/documents/${docId}/preview`);
  view.docId = docId; view.info = previewCache[docId];
  view.page = Math.min(Math.max(1, page), view.info.page_count || 1);
  renderPreview();
  document.querySelectorAll(".doc").forEach((li) => li.classList.toggle("selected", li.dataset.id === docId));
  if (reveal) {
    if (isDrawer("docs-panel")) document.body.classList.add("show-docs");
    $("preview").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function renderPreview() {
  const { info, page, docId } = view;
  $("preview").hidden = false;
  $("preview-name").textContent = docLabel(docId);
  $("preview-where").textContent = `Page ${page} of ${info.page_count}`;
  $("prev-page").disabled = page <= 1;
  $("next-page").disabled = page >= info.page_count;
  const box = $("preview-page"), open = $("preview-open");
  if (info.kind === "text") {
    box.replaceChildren(el("pre", {}, info.text_pages[page - 1] || "(This page has no text.)"));
    open.hidden = true;
  } else {
    const src = url(`/documents/${docId}/pages/${page}`);
    box.replaceChildren(el("img", { src, alt: `${docLabel(docId)}, page ${page}` }));
    open.href = src; open.hidden = false;
  }
}
function closePreview() {
  view.docId = null; $("preview").hidden = true;
  document.querySelectorAll(".doc.selected").forEach((li) => li.classList.remove("selected"));
}
$("prev-page").addEventListener("click", () => { view.page--; renderPreview(); });
$("next-page").addEventListener("click", () => { view.page++; renderPreview(); });
$("close-preview").addEventListener("click", closePreview);

async function deleteDoc(d, button) {
  if (!confirm(`Remove "${docLabel(d.doc_id)}"? It is removed from DocBlendAI only; your original file is not touched.`)) return;
  button.disabled = true;
  try {
    await api(`/documents/${d.doc_id}`, { method: "DELETE" });
    if (view.docId === d.doc_id) closePreview();
    delete previewCache[d.doc_id];
    setStatus("upload-status", `Removed ${docLabel(d.doc_id)}.`);
    await loadDocs();
  } catch (err) {
    button.disabled = false;
    setStatus("upload-status", err.message, "error");
  }
}

async function loadDocs() {
  const list = $("docs");
  const docs = await api("/documents");
  list.replaceChildren();
  for (const k of Object.keys(docNames)) delete docNames[k];
  $("doc-count").textContent = docs.length ? `${docs.length} file${docs.length === 1 ? "" : "s"}` : "";
  if (!docs.length) list.append(el("li", { class: "muted-note" }, "No documents yet."));
  for (const d of docs) {
    const name = nameFromPath(d);
    docNames[d.doc_id] = name;
    const open = el("button", { class: "doc-open", type: "button", title: `Preview ${name}` },
      el("span", { class: "ftype", "aria-hidden": "true" }, typeTag(name)),
      el("span", { class: "doc-info" },
        el("span", { class: "doc-name" }, name),
        el("span", { class: "doc-meta" }, `${FORMAT_LABEL[d.format_type]} · ${pages(d.page_count)}`)));
    open.addEventListener("click", () => openPreview(d.doc_id).catch((err) => setStatus("upload-status", err.message, "error")));
    const remove = iconButton("trash", `Remove ${name}`, "danger");
    remove.addEventListener("click", () => deleteDoc(d, remove));
    const li = el("li", { class: `doc${view.docId === d.doc_id ? " selected" : ""}` }, open, remove);
    li.dataset.id = d.doc_id;
    list.append(li);
  }
  if ($("thread").querySelector(".welcome")) showWelcome();  // the hint depends on whether documents exist
}

// Upload: click the box, or drop a file anywhere on the page (instead of the browser opening it).
const fileInput = $("file"), drop = $("drop");
function showChosen() { const f = fileInput.files[0]; $("chosen").textContent = f ? `Selected: ${f.name}` : ""; }
fileInput.addEventListener("change", showChosen);
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); drop.classList.add("dragging"); } });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) drop.classList.remove("dragging"); });
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  drop.classList.remove("dragging");
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    showChosen();
    setStatus("upload-status", "File ready. Press Upload.");
    if (isDrawer("docs-panel")) document.body.classList.add("show-docs");
  }
});

$("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) { setStatus("upload-status", "Choose a file first.", "error"); return; }
  const btn = $("upload-btn");
  const form = new FormData();
  form.append("file", file);
  const hint = $("hint").value;
  if (hint) form.append("format_hint", hint);
  btn.disabled = true; btn.textContent = "Uploading…";
  setStatus("upload-status", "Reading the file. Scanned and handwritten pages can take a minute.");
  try {
    const { body: doc, status: code } = await api("/upload", { method: "POST", body: form }, true);
    await loadDocs();
    if (code === 200) setStatus("upload-status", `Already uploaded as ${docLabel(doc.doc_id)}, so it was not added again.`);
    else setStatus("upload-status", `Added: ${FORMAT_LABEL[doc.format_type].toLowerCase()}, ${pages(doc.page_count)}.`, "ok");
    e.target.reset(); showChosen();
    openPreview(doc.doc_id).catch(() => {});
  } catch (err) {
    setStatus("upload-status", err.message, "error");
  } finally { btn.disabled = false; btn.textContent = "Upload"; }
});

// ---------------- start ----------------
(async () => {
  try {
    await loadDocs();
    newChat();
  } catch (err) {
    showWelcome();
    $("thread").append(el("div", { class: "msg-bot failed" }, el("div", { class: "body" }, err.message)));
  }
})();
</script>
</body>
