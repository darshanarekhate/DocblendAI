<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocBlendAI</title>
<link rel="icon" href="data:,">
<style>
  /* ================= Palette & tokens ================= */
  :root {
    color-scheme: light;
    /* neutrals */
    --page: #f7f5f0;        /* warm off-white page */
    --card: #ffffff;
    --subtle: #f3f1ec;      /* inputs, hover, quotes */
    --border: #e6e1d8;
    --border-strong: #d3ccc0;
    --text: #1e293b;        /* navy ink */
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    /* one accent */
    --primary: #2e5e8c;     /* muted blue */
    --primary-hover: #244b70;
    --primary-tint: #eaf1f8;
    /* reliability (and scores) only */
    --green: #3d7a57;  --green-tint: #e8f3ec;
    --amber: #9a6700;  --amber-tint: #fbf1dc;
    --slate: #475569;  --slate-tint: #eef1f5;
    --red: #b42318;    --red-tint: #fdecea;
    /* shape & type */
    --r-card: 10px;
    --r-control: 7px;
    --shadow: 0 1px 2px rgba(30, 41, 59, 0.05);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  /* ================= Base ================= */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.6 var(--font); }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ================= Controls ================= */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px;
         border: 1px solid var(--primary); border-radius: var(--r-control); background: var(--primary); color: #fff;
         font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.secondary { background: var(--card); color: var(--text); border-color: var(--border-strong); font-weight: 500; }
  .btn.secondary:hover:not(:disabled) { background: var(--subtle); border-color: var(--border-strong); }
  .btn.small { height: 32px; padding: 0 12px; font-size: 14px; }
  .icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 6px;
              background: none; color: var(--text-faint); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--subtle); color: var(--text); }
  .icon-btn.remove:hover { background: var(--red-tint); color: var(--red); }
  select { height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--r-control); background: var(--card); }

  /* ================= Layout ================= */
  .topbar { height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: var(--card);
            border-bottom: 1px solid var(--border); }
  .brand { font-size: 19px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .brand span { color: var(--primary); }
  .tagline { color: var(--text-muted); font-size: 14px; }
  .topbar .spacer { flex: 1; }
  .tabs { display: none; }

  .layout { height: calc(100% - 58px); display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px;
            padding: 20px 24px; max-width: 1320px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow);
          min-height: 0; min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px;
               border-bottom: 1px solid var(--border); }
  .card-head h2 { font-size: 15px; font-weight: 600; }
  .card-head .count { font-size: 13px; color: var(--text-muted); }

  /* ================= Documents ================= */
  .docs { display: flex; flex-direction: column; }
  .upload { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 12px; text-align: center;
          border: 1.5px dashed var(--border-strong); border-radius: var(--r-control); background: var(--subtle); cursor: pointer;
          transition: border-color .12s, background-color .12s; }
  .drop:hover, .drop.dragging { border-color: var(--primary); background: var(--primary-tint); }
  .drop svg { color: var(--primary); margin-bottom: 4px; }
  .drop strong { font-size: 14.5px; font-weight: 600; }
  .drop small { font-size: 12.5px; color: var(--text-muted); }
  .drop .chosen { margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--primary); word-break: break-all; }
  .upload-row { display: flex; gap: 8px; margin-top: 10px; }
  .upload-row select { flex: 1; min-width: 0; }
  .notice { margin-top: 10px; font-size: 13.5px; color: var(--text-muted); }
  .notice:empty { display: none; }
  .notice.ok { color: var(--green); }
  .notice.error { color: var(--red); }

  .doc-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .doc { display: flex; align-items: center; gap: 4px; border-radius: var(--r-control); }
  .doc:hover { background: var(--subtle); }
  .doc-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 10px;
              border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--r-control); }
  .ftype { flex: none; width: 42px; padding: 3px 0; border-radius: 5px; text-align: center; font-size: 10.5px; font-weight: 700;
           letter-spacing: .04em; color: var(--primary); background: var(--primary-tint); }
  .doc-text { min-width: 0; }
  .doc-name { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { display: block; font-size: 12.5px; color: var(--text-muted); }
  .empty { padding: 18px 12px; text-align: center; font-size: 14px; color: var(--text-muted); }

  /* ================= Chat ================= */
  .chat { display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 22px 24px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .welcome { margin: 10vh auto 0; max-width: 460px; text-align: center; }
  .welcome h3 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .welcome p { color: var(--text-muted); }

  .bubble-user { align-self: flex-end; max-width: 80%; padding: 10px 14px; border-radius: 12px 12px 4px 12px;
                 background: var(--primary); color: #fff; white-space: pre-wrap; }
  .bubble-bot { align-self: stretch; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px 12px 12px 4px;
                background: var(--card); }
  .bubble-bot .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bubble-bot .who { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .answer p { margin-bottom: 8px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 8px; padding-left: 22px; }
  .why { margin-top: 8px; font-size: 13.5px; color: var(--text-muted); }
  .bubble-bot.pending { color: var(--text-muted); }
  .bubble-bot.failed { border-color: #f1c7c2; background: var(--red-tint); color: var(--red); }
  .dots::after { content: "…"; display: inline-block; overflow: hidden; vertical-align: bottom; width: 0;
                 animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { to { width: 1.2em; } }

  .label { padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--tone); background: var(--tint); }
  .Certain { --tone: var(--green); --tint: var(--green-tint); }
  .Moderate { --tone: var(--amber); --tint: var(--amber-tint); }
  .Uncertain { --tone: var(--slate); --tint: var(--slate-tint); }
  .Unreadable { --tone: var(--red); --tint: var(--red-tint); }

  .sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .sources > summary { cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--primary); }
  .source-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .source { display: grid; grid-template-columns: 22px minmax(0, 1fr); font-size: 14px; }
  .source .n { grid-row: span 3; color: var(--text-faint); font-weight: 600; }
  .source .where { overflow-wrap: anywhere; }
  .source .where b { font-weight: 600; }
  .page-link { border: 0; background: none; padding: 0; color: var(--primary); cursor: pointer; white-space: nowrap;
               text-decoration: underline; text-underline-offset: 2px; }
  .scores { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 2px; font-size: 12.5px; color: var(--text-muted); }
  .meter { display: inline-flex; align-items: center; gap: 6px; }
  .meter i { width: 50px; height: 5px; border-radius: 3px; background: var(--green-tint); overflow: hidden; }
  .meter i b { display: block; height: 100%; background: var(--green); }
  .meter em { font-style: normal; font-weight: 600; color: var(--green); }
  .source details summary { cursor: pointer; font-size: 13px; color: var(--primary); }
  .source blockquote { margin: 6px 0 0; padding: 8px 12px; border-left: 3px solid var(--border-strong); border-radius: 0 6px 6px 0;
                       background: var(--subtle); font-size: 13.5px; white-space: pre-wrap; max-height: 170px; overflow: auto; }

  .composer { padding: 14px 24px 16px; border-top: 1px solid var(--border); }
  .composer form { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px;
                   border: 1px solid var(--border-strong); border-radius: 12px; background: var(--card); }
  .composer form:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .composer textarea { flex: 1; min-height: 26px; max-height: 160px; padding: 6px 0; border: 0; resize: none; background: none;
                       line-height: 1.5; font-size: 15px; }
  .composer textarea:focus-visible { outline: none; }
  .composer .hint { max-width: 760px; margin: 6px auto 0; font-size: 12.5px; color: var(--text-faint); }

  /* ================= Preview window ================= */
  dialog.preview { width: min(760px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 1px solid var(--border);
                   border-radius: var(--r-card); background: var(--card); color: var(--text); box-shadow: 0 12px 32px rgba(30, 41, 59, .18); }
  dialog.preview::backdrop { background: rgba(30, 41, 59, .35); }
  .preview-inner { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .preview-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--border); }
  .preview-head h2 { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-body { overflow: auto; background: var(--subtle); padding: 16px; }
  .preview-body img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .preview-body pre { margin: 0; padding: 16px; border: 1px solid var(--border); border-radius: 6px; background: #fff;
                      font: 14px/1.65 var(--font); white-space: pre-wrap; }
  .preview-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px;
                  border-top: 1px solid var(--border); }
  .preview-foot .where { font-size: 13.5px; color: var(--text-muted); }
  .preview-foot a { font-size: 13px; color: var(--primary); }

  /* ================= Small screens: Chat | Documents tabs ================= */
  @media (max-width: 860px) {
    .tagline { display: none; }
    .topbar { padding: 0 12px; gap: 8px; }
    .brand { font-size: 17px; }
    .topbar .spacer { display: none; }
    .tabs { margin-left: auto; }
    #new-chat { padding: 0 10px; }
    .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: var(--subtle); }
    .tabs button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none; font-size: 14px; font-weight: 500;
                   color: var(--text-muted); cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
    .layout { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    body[data-tab="chat"] .docs, body[data-tab="docs"] .chat { display: none; }
    .messages { padding: 16px 14px; }
    .composer { padding: 10px 12px 12px; }
    .bubble-user { max-width: 90%; }
  }
</style>
</head>
<body data-tab="chat">

<header class="topbar">
  <span class="brand">Doc<span>Blend</span>AI</span>
  <span class="tagline">Ask questions about typed, scanned and handwritten notes</span>
  <span class="spacer"></span>
  <nav class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" id="tab-chat" aria-selected="true">Chat</button>
    <button type="button" role="tab" id="tab-docs" aria-selected="false">Documents</button>
  </nav>
  <button type="button" class="btn secondary small" id="new-chat">New chat</button>
</header>

<div class="layout">
  <!-- ============ Documents ============ -->
  <section class="card docs" aria-labelledby="docs-title">
    <div class="card-head"><h2 id="docs-title">Documents</h2><span class="count" id="doc-count"></span></div>
    <form class="upload" id="upload-form">
      <label class="drop" id="drop" for="file">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>
        </svg>
        <strong>Drop a file here or click to browse</strong>
        <small>PDF, Word, PowerPoint, text or image</small>
        <span class="chosen" id="chosen"></span>
      </label>
      <input type="file" id="file" class="sr-only" accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp,.docx,.pptx,.txt">
      <div class="upload-row">
        <label class="sr-only" for="format-hint">Document type</label>
        <select id="format-hint">
          <option value="">Detect type automatically</option>
          <option value="typed">Typed</option>
          <option value="scanned">Scanned or printed</option>
          <option value="handwritten">Handwritten</option>
        </select>
        <button type="submit" class="btn" id="upload-btn">Upload</button>
      </div>
      <p class="notice" id="upload-notice" role="status"></p>
    </form>
    <ul class="doc-list" id="doc-list"></ul>
  </section>

  <!-- ============ Chat ============ -->
  <section class="card chat" aria-label="Chat">
    <div class="messages" id="messages"><div class="thread" id="thread"></div></div>
    <div class="composer">
      <form id="ask-form">
        <label class="sr-only" for="question">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask about your documents…"></textarea>
        <button type="submit" class="btn" id="ask-btn">Send</button>
      </form>
      <p class="hint">Enter to send · Shift + Enter for a new line</p>
    </div>
  </section>
</div>

<!-- ============ Preview window ============ -->
<dialog class="preview" id="preview" aria-labelledby="preview-title">
  <div class="preview-inner">
    <div class="preview-head">
      <h2 id="preview-title"></h2>
      <button type="button" class="icon-btn" id="preview-close" aria-label="Close preview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="preview-body" id="preview-body"></div>
    <div class="preview-foot">
      <button type="button" class="btn secondary small" id="page-prev">‹ Previous</button>
      <span class="where" id="page-where"></span>
      <a id="page-full" target="_blank" rel="noopener">Full size</a>
      <button type="button" class="btn secondary small" id="page-next">Next ›</button>
    </div>
  </div>
</dialog>

<script>
/* =====================================================================
   Small helpers
   ===================================================================== */
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (node.className = v) : node.setAttribute(k, v);
  node.append(...children);
  return node;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const ICON_TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

/* =====================================================================
   Server connection
   Normally the page is served by the DocBlendAI server. If index.html is opened
   directly (or from an editor preview), fall back to the default local server.
   ===================================================================== */
const Server = {
  LOCAL: "http://127.0.0.1:8000",
  DOWN: "Cannot reach the DocBlendAI server. Start it with: venv/Scripts/python -m uvicorn app.main:app --port 8000, then open http://localhost:8000",
  base: null,

  async find() {
    if (this.base !== null) return;
    const candidates = location.protocol.startsWith("http") ? [location.origin, this.LOCAL] : [this.LOCAL];
    for (const base of candidates) {
      try {
        const r = await fetch(`${base}/health`);
        if (r.ok && (await r.json()).status === "ok") { this.base = base === location.origin ? "" : base; return; }
      } catch { /* try next */ }
    }
    throw new Error(this.DOWN);
  },
  url(path) { return `${this.base || ""}${path}`; },

  async call(path, options = {}) {
    await this.find();
    let resp;
    try { resp = await fetch(this.url(path), options); }
    catch { this.base = null; throw new Error(this.DOWN); }
    const body = resp.status === 204 ? {} : await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${resp.status})`);
    return { body, status: resp.status };
  },
  async get(path) { return (await this.call(path)).body; },
  async post(path, data) {
    return (await this.call(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })).body;
  },
};

/* =====================================================================
   Documents: upload (click or drag and drop), list, remove
   ===================================================================== */
const FORMAT = { typed: "Typed", scanned: "Scanned", handwritten: "Handwritten" };
const TYPE_TAG = { pdf: "PDF", docx: "DOCX", pptx: "PPTX", txt: "TXT" };

const Docs = {
  names: {},   // doc_id -> original file name

  nameOf(id) { return this.names[id] || id.slice(0, 8); },
  hasAny() { return Object.keys(this.names).length > 0; },
  notice(text, kind = "") { const n = $("upload-notice"); n.className = `notice ${kind}`.trim(); n.textContent = text; },

  fileName(doc) {  // uploads are stored as "<doc_id>_<original name>.<ext>"
    const base = doc.file_path.split(/[\\/]/).pop();
    return base.startsWith(doc.doc_id + "_") ? base.slice(doc.doc_id.length + 1) : base;
  },

  async load() {
    const docs = await Server.get("/documents");
    this.names = {};
    const list = $("doc-list");
    list.replaceChildren();
    $("doc-count").textContent = docs.length ? plural(docs.length, "file") : "";
    if (!docs.length) list.append(h("li", { class: "empty" }, "No documents yet. Upload one to get started."));
    for (const doc of docs) list.append(this.row(doc));
    Chat.refreshWelcome();
  },

  row(doc) {
    const name = this.fileName(doc);
    this.names[doc.doc_id] = name;
    const open = h("button", { type: "button", class: "doc-open", title: `Preview ${name}` },
      h("span", { class: "ftype", "aria-hidden": "true" }, TYPE_TAG[name.split(".").pop().toLowerCase()] || "IMG"),
      h("span", { class: "doc-text" },
        h("span", { class: "doc-name" }, name),
        h("span", { class: "doc-meta" }, `${FORMAT[doc.format_type]} · ${plural(doc.page_count, "page")}`)));
    open.addEventListener("click", () => Preview.open(doc.doc_id).catch((e) => this.notice(e.message, "error")));
    const remove = h("button", { type: "button", class: "icon-btn remove", "aria-label": `Remove ${name}`, title: "Remove" });
    remove.innerHTML = ICON_TRASH;
    remove.addEventListener("click", () => this.remove(doc.doc_id, remove));
    return h("li", { class: "doc" }, open, remove);
  },

  async remove(id, button) {   // deletes straight away, no confirmation
    button.disabled = true;
    const name = this.nameOf(id);
    try {
      await Server.call(`/documents/${id}`, { method: "DELETE" });
      Preview.forget(id);
      this.notice(`Removed ${name}.`);
      await this.load();
    } catch (e) {
      button.disabled = false;
      this.notice(e.message, "error");
    }
  },

  async upload(file) {
    const form = new FormData();
    form.append("file", file);
    const hint = $("format-hint").value;
    if (hint) form.append("format_hint", hint);
    const btn = $("upload-btn");
    btn.disabled = true; btn.textContent = "Uploading…";
    this.notice("Reading the file. Scanned and handwritten pages can take a minute.");
    try {
      const { body: doc, status } = await Server.call("/upload", { method: "POST", body: form });
      await this.load();
      if (status === 200) this.notice(`Already uploaded as ${this.nameOf(doc.doc_id)}, so it was not added again.`);
      else this.notice(`Added ${this.nameOf(doc.doc_id)}: ${FORMAT[doc.format_type].toLowerCase()}, ${plural(doc.page_count, "page")}.`, "ok");
      $("upload-form").reset(); this.showChosen();
    } catch (e) {
      this.notice(e.message, "error");
    } finally { btn.disabled = false; btn.textContent = "Upload"; }
  },

  showChosen() { const f = $("file").files[0]; $("chosen").textContent = f ? `Selected: ${f.name}` : ""; },

  init() {
    $("file").addEventListener("change", () => this.showChosen());
    $("upload-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const file = $("file").files[0];
      if (!file) { this.notice("Choose a file first.", "error"); return; }
      this.upload(file);
    });
    // A file dropped anywhere on the page goes to the upload box (instead of the browser opening it).
    const drop = $("drop");
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); drop.classList.add("dragging"); } });
    window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) drop.classList.remove("dragging"); });
    window.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      drop.classList.remove("dragging");
      if (!e.dataTransfer.files.length) return;
      $("file").files = e.dataTransfer.files;
      this.showChosen();
      this.notice("File ready. Press Upload.");
      Tabs.show("docs");
    });
  },
};

/* =====================================================================
   Preview window: page images (PDF, images) or text (Word, PowerPoint, .txt)
   ===================================================================== */
const Preview = {
  cache: {}, docId: null, page: 1, info: null,

  async open(docId, page = 1) {
    if (!this.cache[docId]) this.cache[docId] = await Server.get(`/documents/${docId}/preview`);
    this.docId = docId; this.info = this.cache[docId];
    this.page = Math.min(Math.max(1, page), this.info.page_count || 1);
    this.render();
    if (!$("preview").open) $("preview").showModal();
  },

  render() {
    const { info, page, docId } = this;
    $("preview-title").textContent = Docs.nameOf(docId);
    $("page-where").textContent = `Page ${page} of ${info.page_count}`;
    $("page-prev").disabled = page <= 1;
    $("page-next").disabled = page >= info.page_count;
    const body = $("preview-body"), full = $("page-full");
    if (info.kind === "text") {
      body.replaceChildren(h("pre", {}, info.text_pages[page - 1] || "(This page has no text.)"));
      full.hidden = true;
    } else {
      const src = Server.url(`/documents/${docId}/pages/${page}`);
      body.replaceChildren(h("img", { src, alt: `${Docs.nameOf(docId)}, page ${page}` }));
      full.href = src; full.hidden = false;
    }
    body.scrollTop = 0;
  },

  forget(docId) { delete this.cache[docId]; if (this.docId === docId && $("preview").open) $("preview").close(); },

  init() {
    $("page-prev").addEventListener("click", () => { this.page--; this.render(); });
    $("page-next").addEventListener("click", () => { this.page++; this.render(); });
    $("preview-close").addEventListener("click", () => $("preview").close());
    $("preview").addEventListener("click", (e) => { if (e.target === $("preview")) $("preview").close(); });  // click outside
  },
};

/* =====================================================================
   Chat: the current conversation only (no saved history). The last few turns
   are sent with each question so follow-ups like "explain that" work.
   ===================================================================== */
const WHY = {
  Certain: "Strong match in clearly readable text.",
  Moderate: "Relevant text found, but the match was looser or the text was only partly legible.",
  Uncertain: "No strong supporting passage. Check the source before relying on this.",
  Unreadable: "The relevant passage could not be read reliably (poor scan or handwriting).",
};

const Chat = {
  turns: [],   // {question, answer}

  reset() {
    this.turns = [];
    $("thread").replaceChildren(this.welcome());
    $("question").focus();
  },

  welcome() {
    return h("div", { class: "welcome" },
      h("h3", {}, "Ask about your documents"),
      h("p", {}, Docs.hasAny()
        ? "Ask a question, then follow up on the answer. Each answer shows how far to trust it and which pages it came from."
        : "Upload a document first, then ask a question here."));
  },
  refreshWelcome() { const w = $("thread").querySelector(".welcome"); if (w) w.replaceWith(this.welcome()); },

  // Answers may use light Markdown (**bold**, lists). Escape first; never inject raw HTML.
  renderAnswer(text) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*(\S.*?)\*(?=\W|$)/g, "$1<em>$2</em>");
    let html = "", list = null;
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const bullet = line.match(/^[-*•]\s+(.*)/), numbered = line.match(/^\d+[.)]\s+(.*)/);
      const kind = bullet ? "ul" : numbered ? "ol" : null;
      if (list && kind !== list) { html += `</${list}>`; list = null; }
      if (kind) { if (!list) { html += `<${kind}>`; list = kind; } html += `<li>${inline((bullet || numbered)[1])}</li>`; }
      else if (line) html += `<p>${inline(line)}</p>`;
    }
    if (list) html += `</${list}>`;
    const div = h("div", { class: "answer" });
    div.innerHTML = html;
    return div;
  },

  meter(label, v) {
    const pct = Math.round(v * 100);
    return h("span", { class: "meter", title: `${label}: ${pct}%` }, label, h("i", {}, h("b", { style: `width:${pct}%` })), h("em", {}, `${pct}%`));
  },

  source(s, n) {
    const where = h("div", { class: "where" }, h("b", {}, Docs.nameOf(s.doc_id)));
    if (s.page) {
      let text = `Page ${s.page}`;
      if (s.first_line) text += s.last_line && s.last_line !== s.first_line ? `, lines ${s.first_line}–${s.last_line}` : `, line ${s.first_line}`;
      const link = h("button", { type: "button", class: "page-link", title: "Open this page" }, text);
      link.addEventListener("click", () => Preview.open(s.doc_id, s.page).catch((e) => this.fail(e.message)));
      where.append(" · ", link);
    }
    return h("li", { class: "source" },
      h("span", { class: "n" }, `${n}.`),
      where,
      h("div", { class: "scores" }, this.meter("Match", s.similarity), this.meter("Readability", s.confidence)),
      h("details", {}, h("summary", {}, "Show passage"), h("blockquote", {}, s.text)));
  },

  botBubble(answer, sources) {
    const label = answer.reliability_label;
    const node = h("div", { class: "bubble-bot" },
      h("div", { class: "meta" }, h("span", { class: "who" }, "DocBlendAI"), h("span", { class: `label ${label}` }, label)),
      this.renderAnswer(answer.answer_text),
      h("p", { class: "why" }, WHY[label]));
    if (sources.length) {
      const list = h("ol", { class: "source-list" });
      sources.forEach((s, i) => list.append(this.source(s, i + 1)));
      node.append(h("details", { class: "sources" }, h("summary", {}, `Sources (${sources.length})`), list));
    }
    return node;
  },

  fail(message) { $("thread").append(h("div", { class: "bubble-bot failed" }, message)); this.scroll(); },
  scroll() { const m = $("messages"); m.scrollTop = m.scrollHeight; },

  async ask(text) {
    const thread = $("thread");
    thread.querySelector(".welcome")?.remove();
    const pending = h("div", { class: "bubble-bot pending" }, h("span", { class: "dots" }, "Reading your documents"));
    thread.append(h("div", { class: "bubble-user" }, text), pending);
    this.scroll();
    try {
      const reply = await Server.post("/chat", { question_text: text, history: this.turns.slice(-3) });
      this.turns.push({ question: text, answer: reply.answer.answer_text });
      pending.replaceWith(this.botBubble(reply.answer, reply.sources));
      return true;
    } catch (e) {
      pending.className = "bubble-bot failed";
      pending.textContent = e.message;
      return false;
    } finally { this.scroll(); }
  },

  init() {
    const q = $("question"), btn = $("ask-btn");
    const fit = () => { q.style.height = "auto"; q.style.height = `${Math.min(q.scrollHeight, 160)}px`; };
    q.addEventListener("input", fit);
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask-form").requestSubmit(); } });
    $("ask-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text || btn.disabled) return;
      btn.disabled = true;
      q.value = ""; fit();
      const ok = await this.ask(text);
      if (!ok && !q.value) { q.value = text; fit(); }   // keep the question so it can be re-sent
      btn.disabled = false; q.focus();
    });
    $("new-chat").addEventListener("click", () => { this.reset(); Tabs.show("chat"); });
  },
};

/* =====================================================================
   Tabs (small screens only): Chat | Documents
   ===================================================================== */
const Tabs = {
  show(tab) {
    document.body.dataset.tab = tab;
    $("tab-chat").setAttribute("aria-selected", tab === "chat");
    $("tab-docs").setAttribute("aria-selected", tab === "docs");
  },
  init() {
    $("tab-chat").addEventListener("click", () => this.show("chat"));
    $("tab-docs").addEventListener("click", () => this.show("docs"));
  },
};

/* =====================================================================
   Start
   ===================================================================== */
Docs.init(); Preview.init(); Chat.init(); Tabs.init();
Chat.reset();
Docs.load().catch((e) => { Docs.notice(e.message, "error"); Chat.fail(e.message); });
</script>
</body>
</html>
